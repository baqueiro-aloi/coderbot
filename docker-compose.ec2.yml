# EC2 (or any Linux host) variant of docker-compose.yml — run standalone, not merged
# with the base file:
#   docker compose -f docker-compose.ec2.yml up -d --build
# Assumes this repo is cloned at /opt/coderbot and the target repo at
# $CODEBOT_REPO_PATH (set in the env file, e.g. /opt/<target-repo>), with the
# host-side credential files provisioned under /opt/codebot/:
#   /opt/codebot/codebot.env          -> the .env (see .env.example)
#   /opt/codebot/claude/               -> ~/.claude for the bot (contains .credentials.json)
#   /opt/codebot/claude.json           -> read-only seed of ~/.claude.json
#   /opt/coderbot/data/{token,credentials}.json -> Google OAuth files
services:
  codebot:
    build: .
    restart: unless-stopped
    env_file: /opt/codebot/codebot.env
    volumes:
      - /opt/coderbot:/app
      - ${CODEBOT_REPO_PATH:?Set CODEBOT_REPO_PATH in the env file}:${CODEBOT_REPO_PATH}
      - /opt/codebot/claude:/home/bot/.claude
      # Read-only seed; entrypoint.sh copies it to a container-private file (see base file).
      - /opt/codebot/claude.json:/seed/.claude.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
